# Scheduled capture — build plan stage 6.
#
# The point is not to keep the cache warm. It is that county clerks overwrite
# these documents every cycle and retain nothing: a document not fetched while
# it is posted is gone for good. So this runs often during the months when
# documents appear, and its job is to notice new ones.
#
# Three things make that work on a runner rather than a laptop:
#
#   * `--new-only`. A runner starts with no cache, so the ordinary "do I hold
#     these bytes" check would find nothing and re-download all 481 documents
#     from county servers every night. This mode trusts the ledger instead and
#     fetches only what has never been recorded.
#   * The Internet Archive is the durable store. The runner's cache is thrown
#     away when the job ends, so anything newly captured is submitted to the
#     Archive in the same run. Without that, a scheduled capture records a
#     sha256 for bytes nobody keeps.
#   * The ledger is committed back. It is the index of everything captured, and
#     it is sharded per cycle so a nightly run does not produce an unreadable
#     diff.
#
# Requires IA_ACCESS_KEY and IA_SECRET_KEY as repository secrets, from
# https://archive.org/account/s3.php — without them the Archive step is skipped
# and captured bytes are kept only as a 90-day workflow artifact.

name: capture

on:
  schedule:
    # Daily through the season documents appear: filing closes in late July,
    # sample ballots post from mid-October, the election is early November.
    - cron: "17 9 * 6,7,8,9,10,11 *"
    # Monthly otherwise, so a mid-cycle republication is still noticed.
    - cron: "17 9 1 1,2,3,4,5,12 *"
  workflow_dispatch:
    inputs:
      county:
        description: "Limit to one county (optional)"
        required: false

# One capture at a time: two runs appending to the same ledger would interleave.
concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Capture anything the ledger has never seen
        id: capture
        run: |
          uv run capture --new-only \
            ${{ inputs.county && format('--county {0}', inputs.county) || '' }} \
            | tee capture.log
          echo "new=$(find cache -type f -name '*.pdf' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Keep a copy of anything new
        if: steps.capture.outputs.new != '0'
        uses: actions/upload-artifact@v4
        with:
          name: captured-${{ github.run_id }}
          path: cache/
          retention-days: 90

      - name: Ask the Internet Archive to keep its own copy
        if: steps.capture.outputs.new != '0' && secrets.IA_ACCESS_KEY != ''
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: uv run archive --limit 200 || true

      - name: Commit the ledger
        run: |
          if git diff --quiet -- data/; then
            echo "nothing new"; exit 0
          fi
          git config user.name "capture"
          git config user.email "capture@users.noreply.github.com"
          git add data/
          git commit -m "capture: $(date -u +%Y-%m-%d)

          $(tail -1 capture.log)"
          git push

      # A county that has never worked is a known gap and stays quiet. A county
      # that worked last month and fails today has moved its documents, and
      # every cycle after that is lost unless somebody is told.
      - name: Check for documents that stopped working
        id: regressions
        if: always()
        continue-on-error: true
        run: |
          uv run capture --regressions 2>regressions.txt
          echo "failed=$?" >> "$GITHUB_OUTPUT"

      - name: Open an issue if something regressed
        if: always() && steps.regressions.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Capture: documents that used to work have stopped"
          # one open issue at a time, updated rather than duplicated nightly
          existing=$(gh issue list --state open --search "$title" \
                       --json number --jq '.[0].number')
          body=$(printf '%s\n\n```\n%s\n```\n' \
                   "Found by the scheduled capture on $(date -u +%Y-%m-%d)." \
                   "$(cat regressions.txt)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label capture
          fi
